# identity / evaluator.yaml
# Per-repo evaluation configuration — ecosystem-standards ADR-001, ADR-002

type: shared-library

exemptions:
  - rule: XSTACK-001
    reason: "identity sits below common-python-utils, not beside it. It is the contract every enforcement point binds — api-kaianolevine-com consumes it, and common-python-utils' API client speaks the credential format it defines. Declaring common-python-utils as a dependency would invert that layering and risk a cycle the moment the shared library needs the contract. identity depends only on pyjwt and httpx, with SQLAlchemy behind the optional [store] extra so a caller that has no principal store does not carry one."

  - rule: PY-006
    reason: "Same layering as XSTACK-001. A calling principal needs the contract and the verifier; it does not need Google clients, LLM clients, or the API client to hold them. Keeping identity's dependency surface to pyjwt and httpx is what lets any service — including one that predates or replaces common-python-utils — become a conformant enforcement point."

  - rule: DOC-004
    reason: "identity reads no environment of its own. Configuration is passed in by the consuming service: ClerkIssuer objects and MachineKey values are constructor arguments, resolved from that service's own settings and documented in that service's .env.example (CD-019). A .env.example here would document variables the library never reads."

# No active deferrals. The ecosystem-wide decision behind this library is
# ecosystem-standards ADR-008; the library-local ones are ADR-001 (prefixed
# tables over a Postgres schema) and ADR-002 (no foreign key from audit
# events to principals).

# CD-002, CD-009, CD-010 (Sentry, shared logger, observability) are not in
# shared-library scope — this repo has no service entry point. TEST-012 is
# conditional on a [tool.mypy] block, which this repo does not declare; mypy
# runs in CI regardless.
