[project]
name = "identity"
version = "0.1.0"
description = "Cross-ecosystem identity contract: principals, roles, scopes, and the four-function binding every enforcement point implements."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.2",
    "ruff>=0.8.0",
    "jsonschema>=4.23",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "identity/schema"
"fixtures" = "identity/fixtures"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
