[project]
name = "identity"
version = "1.2.0"
description = "Cross-ecosystem identity contract: principals, roles, scopes, and the four-function binding every enforcement point implements."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
# The SQLAlchemy-backed principal store and audit sink. Optional because a
# calling principal (a cog) needs the contract and the verifier but has no
# store to resolve against; only an enforcement point does.
store = [
    "sqlalchemy>=2.0",
]
dev = [
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.2",
    "ruff>=0.8.0",
    "jsonschema>=4.23",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "identity/schema"
"fixtures" = "identity/fixtures"

[tool.ruff]
# PY-002 / PY-010. The line length was already what ruff defaults to; the
# rules ask for it to be stated rather than inherited, so a change to
# ruff's default cannot silently reformat this repo.
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
