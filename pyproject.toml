[project]
# Distribution name, not the import name. `identity` was unavailable on
# PyPI — it is taken by an unrelated Microsoft auth library — so the
# distribution carries the ecosystem prefix while the import stays
# `identity`, unchanged at every call site. One consequence to know about:
# the import name is now shared with a package we do not own, so any repo
# that ever installs PyPI `identity` alongside this one gets a top-level
# module collision. Nothing in the fleet does today; if that changes, the
# fix is to rename the import, not the distribution.
# See common-python-utils/docs/pypi-package-publishing.md §6.
name = "miniapppolis-identity"
version = "1.3.2"
description = "Cross-ecosystem identity contract: principals, roles, scopes, and the four-function binding every enforcement point implements."
authors = [{ name = "Kaiano Levine" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pyjwt[crypto]>=2.13.0",
]

[project.optional-dependencies]
# The SQLAlchemy-backed principal store and audit sink. Optional because a
# calling principal (a cog) needs the contract and the verifier but has no
# store to resolve against; only an enforcement point does.
store = [
    "sqlalchemy>=2.0",
]
dev = [
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.2",
    "ruff>=0.8.0",
    "jsonschema>=4.23",
    "pre-commit>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/mini-app-polis/identity"
Repository = "https://github.com/mini-app-polis/identity"
Changelog = "https://github.com/mini-app-polis/identity/blob/main/CHANGELOG.md"
Issues = "https://github.com/mini-app-polis/identity/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "identity/schema"
"fixtures" = "identity/fixtures"

[tool.ruff]
# PY-002 / PY-010. The line length was already what ruff defaults to; the
# rules ask for it to be stated rather than inherited, so a change to
# ruff's default cannot silently reformat this repo.
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
